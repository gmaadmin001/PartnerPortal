name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write .dev.vars
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
          SUPABASE_AUTH_HOOK_SECRET: ${{ secrets.SUPABASE_AUTH_HOOK_SECRET }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PROFESSIONAL_MONTHLY_PRICE_ID: ${{ secrets.STRIPE_PROFESSIONAL_MONTHLY_PRICE_ID }}
          STRIPE_PROFESSIONAL_ANNUAL_PRICE_ID: ${{ secrets.STRIPE_PROFESSIONAL_ANNUAL_PRICE_ID }}
          STRIPE_PREMIER_MONTHLY_PRICE_ID: ${{ secrets.STRIPE_PREMIER_MONTHLY_PRICE_ID }}
          STRIPE_PREMIER_ANNUAL_PRICE_ID: ${{ secrets.STRIPE_PREMIER_ANNUAL_PRICE_ID }}
          STRIPE_VERIFIED_BADGE_PRICE_ID: ${{ secrets.STRIPE_VERIFIED_BADGE_PRICE_ID }}
        run: |
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY"
            echo "EMAILJS_SERVICE_ID=$EMAILJS_SERVICE_ID"
            echo "EMAILJS_TEMPLATE_ID=$EMAILJS_TEMPLATE_ID"
            echo "EMAILJS_PUBLIC_KEY=$EMAILJS_PUBLIC_KEY"
            echo "EMAILJS_PRIVATE_KEY=$EMAILJS_PRIVATE_KEY"
            echo "SUPABASE_AUTH_HOOK_SECRET=$SUPABASE_AUTH_HOOK_SECRET"
            echo "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY"
            echo "STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY"
            echo "STRIPE_WEBHOOK_SECRET=$STRIPE_WEBHOOK_SECRET"
            echo "STRIPE_PROFESSIONAL_MONTHLY_PRICE_ID=$STRIPE_PROFESSIONAL_MONTHLY_PRICE_ID"
            echo "STRIPE_PROFESSIONAL_ANNUAL_PRICE_ID=$STRIPE_PROFESSIONAL_ANNUAL_PRICE_ID"
            echo "STRIPE_PREMIER_MONTHLY_PRICE_ID=$STRIPE_PREMIER_MONTHLY_PRICE_ID"
            echo "STRIPE_PREMIER_ANNUAL_PRICE_ID=$STRIPE_PREMIER_ANNUAL_PRICE_ID"
            echo "STRIPE_VERIFIED_BADGE_PRICE_ID=$STRIPE_VERIFIED_BADGE_PRICE_ID"
          } > .dev.vars

      - name: Build
        run: npx opennextjs-cloudflare build

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
